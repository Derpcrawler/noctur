appId: app.noctur.desktop
afterSign: build/noctur-sign.cjs
productName: Noctur
# Noctur: shown in Windows file properties. The publisher (CompanyName) comes from "author" in
# package.json, set to "Noctur" so upstream authors are not named as publishers of this build.
copyright: Copyright © 2026 Noctur. Based on Koala Clash by coolcoala, which builds on Sparkle by xishang0128 and Mihomo Party by pompurin404. GPL-3.0.
directories:
  buildResources: build
# Noctur: package only what the app loads, listed explicitly. The repo also holds notes, design
# files and tooling that must never ship; an exclusion list let them into the 1.0.0 packages.
# Production node_modules are added by electron-builder.
# build/noctur-check-package.cjs (afterPack) fails the build if anything else ends up in app.asar.
files:
  - out/**
  - resources/**
  - package.json
  - LICENSE
  - '!**/.vscode/**'
afterPack: build/noctur-check-package.cjs
# Noctur: Chromium's own strings only for the app's languages (macOS names them en, ru, zh_CN;
# Windows and Linux en-US, ru, zh-CN). The app picks its language from the system list, which
# does not depend on these.
electronLanguages:
  - en
  - en-US
  - ru
  - zh_CN
  - zh-CN
extraResources:
  - from: './extra/'
    to: ''
protocols:
  name: 'Noctur URI Scheme'
  schemes:
    - 'clash'
    - 'mihomo'
    - 'noctur'
win:
  # Noctur: installer only. Unsigned, so SmartScreen warns on the first run ("More info", then
  # "Run anyway"). The portable 7z is dropped: the app starts itself as administrator through a
  # scheduled task that points at the installed path.
  target:
    - nsis
nsis:
  artifactName: Noctur_${version}_${arch}-setup.${ext}
  uninstallDisplayName: ${productName}
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: true
  createDesktopShortcut: true
  include: build/nsis/installer.nsh
mac:
  target:
    - pkg
  # Ad-hoc signature ("-") only; builds are not signed with an Apple Developer ID.
  identity: '-'
  # No hardened runtime: it turns on library validation, and ad-hoc signed Electron cannot load its own
  # framework under it ("different Team IDs"). The hardened runtime only matters for notarized apps.
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  artifactName: Noctur_${version}_${arch}.${ext}
pkg:
  allowAnywhere: false
  allowCurrentUserHome: false
  # Noctur: always replace the installed app. With the version check on, macOS silently skipped
  # the app when its version was lower than the installed one (1.0.0 after upstream's 1.4.1).
  isVersionChecked: false
  # Always install to /Applications, never to another copy with the same bundle id (e.g. in dist/).
  isRelocatable: false
  # background:
  #   alignment: bottomleft
  #   file: build/background.png
linux:
  desktop:
    entry:
      Name: Noctur
      MimeType: 'x-scheme-handler/clash;x-scheme-handler/mihomo;x-scheme-handler/noctur'
  target:
    - deb
    - rpm
    - pacman
  maintainer: Noctur
  vendor: Noctur
  category: Network
  artifactName: Noctur_${version}_${arch}.${ext}
# Noctur: electron-builder's default dependencies plus setcap (build/linux/postinst gives the core
# TUN rights as file capabilities).
# build/linux/postrm cleans up only on uninstall, not on upgrades (electron-builder's default removed
# the wrong alternative target and ran on rpm upgrades).
# The package was called astra-clash before: Noctur's package replaces it, so installing Noctur
# removes it (deb Conflicts and Replaces, rpm Obsoletes, pacman conflicts and replaces).
deb:
  afterInstall: 'build/linux/postinst'
  afterRemove: 'build/linux/postrm'
  fpm: ['--conflicts', 'astra-clash', '--replaces', 'astra-clash']
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, libcap2-bin]
rpm:
  afterInstall: 'build/linux/postinst'
  afterRemove: 'build/linux/postrm'
  fpm: ['--conflicts', 'astra-clash', '--replaces', 'astra-clash']
  depends: [gtk3, libnotify, nss, libXScrnSaver, '(libXtst or libXtst6)', xdg-utils, at-spi2-core, '(libuuid or libuuid1)', '(libcap-progs or libcap)']
pacman:
  afterInstall: 'build/linux/postinst'
  afterRemove: 'build/linux/postrm'
  # pacman runs post_upgrade, not post_install, on updates; without it the new core files would have
  # no capabilities.
  fpm: ['--after-upgrade', 'build/linux/postinst', '--conflicts', 'astra-clash', '--replaces', 'astra-clash']
  # The electron-builder default names http-parser and libappindicator-gtk3, which Arch no longer has.
  depends: [gtk3, nss, alsa-lib, libnotify, libxss, libxtst, xdg-utils, at-spi2-core, util-linux-libs, libsecret, libcap]
  artifactName: Noctur_${version}_${arch}.pkg.tar.xz
npmRebuild: true
publish: []
